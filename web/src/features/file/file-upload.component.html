<div class="image-page">
  <div class="image-form">
    <!-- Показываем превью, если оно есть. Иначе — заглушку -->
    <img 
      class="image" 
      [src]="imagePreviewUrl || 'assets/images/Screenshot_4.png'" 
      alt="Avatar" 
    />
  </div>

  <div class="image-btn">
    <!-- Скрытый инпут. Именно он ловит выбор файла -->
    <input 
      type="file" 
      #fileInput 
      hidden 
      accept="image/png,image/jpeg" 
      (change)="onFileSelected($event)" 
    />
    
    <!-- Кнопка "+" вызывает клик по скрытому инпуту -->
    <button type="button" class="image-btn-add" (click)="fileInput.click()">+</button>
    
    <!-- Кнопка "-" сбрасывает выбор. Отключена, если файла нет -->
    <button type="button" class="image-btn-delete" (click)="clearSelection()" [disabled]="!selectedFile">-</button>
  </div>
</div>
